name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run pack -- --linux
      - uses: actions/upload-artifact@v4
        with:
          name: html-to-electron-linux-unpacked
          path: dist/linux-unpacked
          if-no-files-found: error
